<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的账户</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="prefetch" href="index.html">
<link rel="prefetch" as="fetch" href="data/portfolio/positions.json" crossorigin>
<link rel="prefetch" as="fetch" href="data/costs/baseline.json" crossorigin>
<link rel="prefetch" as="fetch" href="data/loan/gf_loan.json" crossorigin>
<style>
  :root { --ink:#111827; --sub:#6B7280; --line:#E6E8EC; --up:#DC2626; --down:#16A34A; --accent:#1D4ED8; --gray:#CBD5E1; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif; background:#F6F7F9; color:var(--ink); padding:28px 16px 60px; }
  .wrap { max-width:1080px; margin:0 auto; }
  h1 { font-size:24px; font-weight:700; }
  .sub { color:var(--sub); font-size:13px; margin-top:6px; }
  .head { display:flex; justify-content:space-between; align-items:flex-end; gap:14px; flex-wrap:wrap; }
  .badge { font-size:11.5px; color:#92400E; background:#FEF3C7; border:1px solid #FDE68A; padding:5px 11px; border-radius:999px; white-space:nowrap; }
  .stale { display:inline-block; font-size:10.5px; color:#B91C1C; background:#FEE2E2; border:1px solid #FCA5A5; padding:1.5px 7px; border-radius:999px; margin-left:6px; vertical-align:middle; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin-top:20px; }
  .kpi { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .kpi .l { font-size:12.5px; color:var(--sub); }
  .kpi .v { font-size:22px; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums; }
  .kpi .n { font-size:11.5px; color:var(--sub); margin-top:3px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-top:16px; }
  .ct { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .ct h2 { font-size:15.5px; font-weight:700; }
  .ct .d { font-size:12px; color:var(--sub); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px 12px; margin-top:10px; }
  .cell .l { font-size:12.5px; color:var(--sub); }
  .cell .v { font-size:18px; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums; }
  .cell .n { font-size:11.5px; color:var(--sub); margin-top:3px; }
  .tscroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
  th { text-align:right; padding:8px 10px; border-bottom:1.5px solid var(--line); color:var(--sub); font-weight:600; white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  td { text-align:right; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  tr.sum td { font-weight:700; border-top:1.5px solid var(--line); border-bottom:none; }
  .b { font-weight:600; }
  .foot { color:var(--sub); font-size:11.5px; line-height:1.7; margin-top:14px; }
  .foot a { color:var(--accent); text-decoration:none; }
  .gauge { position:relative; margin:14px 0 8px; }
  .gauge .bar { display:flex; height:8px; border-radius:99px; overflow:hidden; }
  .gauge .bar i { flex:1; }
  .gauge .bar i:nth-child(1) { background:#FCA5A5; }
  .gauge .bar i:nth-child(2) { background:#FCD34D; }
  .gauge .bar i:nth-child(3) { background:#86EFAC; }
  .gauge .bar i:nth-child(4) { background:#4ADE80; }
  .gauge .bar b { position:absolute; top:-6px; width:12px; height:20px; border-radius:3px; background:var(--up); box-shadow:0 1px 4px rgba(0,0,0,.18); transform:translateX(-6px); }
  .gauge .lbls { display:flex; margin-top:7px; }
  .gauge .lbls span { flex:1; min-width:0; text-align:center; font-size:10.5px; color:var(--sub); white-space:nowrap; }
  .gauge .lbls span.on { color:var(--ink); font-weight:600; }
  @media (max-width: 480px) {
    .kpi .v { font-size:18px; }
    .gauge .lbls span { font-size:9px; letter-spacing:-0.2px; }
  }
  .pos2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; margin-top:16px; }
  .pos2 .card { margin-top:0; }
  .pname { display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .pname h3 { font-size:15px; font-weight:700; }
  .pname .code { font-size:12px; color:var(--sub); font-weight:400; margin-left:6px; }
  .pname .chg { font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; }
  .warn { font-size:11.5px; font-weight:600; color:var(--up); }
  .loading { text-align:center; color:var(--sub); padding:40px 0; font-size:14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1>我的账户</h1>
      <div class="sub" id="sub">数据加载中…</div>
    </div>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <span class="badge" id="badge" style="display:none"></span>
      <a href="index.html" style="font-size:13px;color:var(--accent);text-decoration:none">← 返回总览</a>
    </div>
  </div>

  <div class="kpis" id="top"></div>

  <div class="card">
    <div class="ct"><h2>维持担保比例</h2><div class="d">总市值 ÷ 负债（未计现金及在途资金）</div></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
      <div class="cell"><div class="l">维持担保比例</div><div class="v" id="maint">—</div><div class="n" id="maintNote"></div></div>
      <div class="cell"><div class="l">账户净资产</div><div class="v" id="netA">—</div><div class="n">总市值 − 融资负债</div></div>
      <div class="cell"><div class="l">总市值</div><div class="v" id="mvTot">—</div><div class="n" id="mvNote"></div></div>
    </div>
    <div class="gauge" id="gauge"></div>
  </div>

  <div class="card">
    <div class="ct"><h2>融资负债</h2><div class="d" id="finNote"></div></div>
    <div class="grid" id="finGrid"></div>
  </div>

  <div class="pos2" id="positions"></div>
</div>

<script>
const RED='#DC2626', GREEN='#16A34A', GRAY='#9CA3AF';
const fmt = (v, d=2) => v.toLocaleString('zh-CN', {minimumFractionDigits:d, maximumFractionDigits:d});
const up = v => v > 0 ? RED : v < 0 ? GREEN : GRAY;
const signed = (v, d=2) => (v > 0 ? '+' : '') + fmt(v, d);
const pct = (v, d=2) => (v > 0 ? '+' : '') + v.toFixed(d) + '%';

const CDN = 'https://cdn.jsdelivr.net/gh/zhanglaoliu18/annual-returns@main/';
async function fetchJSON(url, tries = 0) {
  for (const u of [url, CDN + url]) {
    try {
      const r = await fetch(u, {cache: 'no-cache'});
      if (r.ok) return await r.json();
    } catch (e) {}
  }
  if (tries > 0) { await new Promise(res => setTimeout(res, 600)); return fetchJSON(url, tries - 1); }
  return null;
}
const parseD = s => new Date(s + 'T00:00:00Z');
const dayDiff = (a, b) => Math.round((parseD(b) - parseD(a)) / 86400000);

/* 北京时间的今天 */
const nowD = new Date();
const TODAY = nowD.toLocaleDateString('sv-SE', {timeZone: 'Asia/Shanghai'});
const WD = new Intl.DateTimeFormat('zh-CN', {timeZone: 'Asia/Shanghai', weekday: 'short'}).format(nowD);

function render(D) {
  const { pos, day, base, gfl } = D;
  const fin = base.costs.financing;
  const list = pos.positions;
  const last = day.days[day.days.length - 1];

  /* --- 持仓：股数(data/portfolio/positions.json) × 收盘价(data/daily/年份.json) --- */
  /* 收盘价缺失的持仓跳过，避免 NaN 连锁污染全部合计 */
  const rowsAll = list.map(p => {
    const price = last.closes[p.code];
    const mv = price != null ? p.shares * price : NaN;
    const costAmt = p.shares * p.cost;
    return {...p, price, mv, costAmt, pnl: mv - costAmt, pnlPct: mv / costAmt * 100 - 100};
  });
  const rows = rowsAll.filter(r => r.price != null);
  const missingN = rowsAll.length - rows.length;
  const mvTot = rows.reduce((s, r) => s + r.mv, 0);
  rows.forEach(r => r.weight = r.mv / mvTot * 100);

  /* --- 盈亏：日/月取 data 里记录的 pnl；累计 = 市值 − 成本 --- */
  const y = day.year;
  const dayPnl = last.pnl;
  /* 当日涨跌基准：优先用日记录的 shares 快照（与 job 口径一致），无快照时退回当前持仓市值 */
  const dayMv = (last.shares && Object.keys(last.shares).length)
    ? Object.entries(last.shares).reduce((s, [c, sh]) => s + sh * (last.closes[c] || 0), 0)
    : mvTot;
  const dayBase = dayMv - dayPnl;
  const dayPct = dayBase ? dayPnl / dayBase * 100 : 0;

  /* --- 负债：本金 + 日息 × 已计天数（start 当天记 1 天） --- */
  /* 按年切分：[start, TODAY] 段跨 12-31 时拆段分别归年，避免新年份把去年尾巴错算进当年合计 */
  const finByYear = {};
  {
    let a = fin.start;
    while (a && a <= TODAY) {
      const yy = a.slice(0, 4);
      const e = (yy + '-12-31') < TODAY ? (yy + '-12-31') : TODAY;
      finByYear[yy] = (finByYear[yy] || 0) + fin.daily * (dayDiff(a, e) + 1);
      a = e === TODAY ? null : (Number(yy) + 1) + '-01-01';
    }
  }
  const days = Math.max(0, dayDiff(fin.start, TODAY) + 1);
  const accrued = fin.daily * days;
  const debt = (fin.principal || 0) + accrued;
  const net = mvTot - debt;
  const ratio = debt > 0 ? mvTot / debt * 100 : 0;
  const annual = fin.principal ? fin.daily * 360 / fin.principal * 100 : 0;

  /* --- 女友负债：借款本金 + 10% 单利（分段计息，与首页一致） --- */
  const gfFlows = [...gfl.flows].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  let gfBal = 0, gfPrev = null, gfDays = 0;
  for (const f of gfFlows) {
    if (gfPrev) gfDays += gfBal * dayDiff(gfPrev, f.date);
    gfBal += f.amount; gfPrev = f.date;
  }
  if (gfPrev) gfDays += gfBal * dayDiff(gfPrev, TODAY);
  const gfInterest = gfDays * gfl.rate / gfl.basis;
  const gfDebt = gfBal + gfInterest;
  const ownNet = mvTot - debt - gfDebt;

  /* --- 头部 --- */
  document.getElementById('sub').textContent = TODAY + ' ' + WD + ' · 两融持仓 · 当日 ' + pct(dayPct);
  const badge = document.getElementById('badge');
  badge.style.display = '';
  badge.textContent = '当日 ' + signed(dayPnl) + ' · 担保 ' + ratio.toFixed(1) + '%';

  /* --- 顶部三卡 --- */
  const stale = last.date !== TODAY ? ' · 数据 ' + last.date.slice(5) : '';
  /* 工作日但当日数据未写入时，当日盈亏卡显示红色「今日尚未更新」（周末 job 跳过属正常，不误报） */
  const dow = new Date(TODAY + 'T12:00:00+08:00').getDay();
  const staleTag = (last.date < TODAY && dow >= 1 && dow <= 5) ? '<span class="stale">今日尚未更新</span>' : '';
  document.getElementById('top').innerHTML = [
    { l: '当日盈亏' + staleTag, v: signed(dayPnl), c: up(dayPnl), n: '总市值 ' + fmt(mvTot) + ' · 当日 ' + pct(dayPct) },
    { l: '本人净资产', v: fmt(ownNet), c: ownNet >= 0 ? 'var(--ink)' : RED, n: '总市值 − 融资负债 − 女友负债' }
  ].map(c => `<div class="kpi"><div class="l">${c.l}</div><div class="v" style="color:${c.c}">${c.v}</div><div class="n">${c.n}${stale}</div></div>`).join('');

  /* --- 担保比例 --- */
  const mt = document.getElementById('maint');
  mt.textContent = ratio.toFixed(1) + '%';
  mt.style.color = ratio < 150 ? RED : (ratio < 300 ? '#B45309' : GREEN);
  document.getElementById('maintNote').textContent = ratio < 150 ? '⚠️ 低于追保线' : (ratio < 300 ? '正常 · 未到可提取线' : '正常');
  document.getElementById('netA').textContent = fmt(net);
  document.getElementById('mvTot').textContent = fmt(mvTot);
  document.getElementById('mvNote').textContent = rows.length + ' 只 · ' + last.date + ' 收盘' + (missingN ? ' · ' + missingN + ' 只无收盘价未计入' : '');

  /* 分区刻度：四个档位等宽分段，档位间隔悬殊也不会挤在一起 */
  const BANDS = [
    { from: 0,   to: 130,       label: '&lt;130 平仓' },
    { from: 130, to: 150,       label: '130–150 追保' },
    { from: 150, to: 300,       label: '150–300 正常' },
    { from: 300, to: Infinity,  label: '≥300 可提取' },
  ];
  const gband = BANDS.find(b => ratio >= b.from && ratio < b.to) || BANDS[BANDS.length - 1];
  const bi = BANDS.indexOf(gband);
  const inBand = Math.min(Math.max((ratio - gband.from) / (gband.to - gband.from || 1), 0), 1);
  const gpos = (bi + inBand) / BANDS.length * 100;
  document.getElementById('gauge').innerHTML =
    '<div class="bar">' + BANDS.map(() => '<i></i>').join('') +
    `<b style="left:${gpos.toFixed(2)}%"></b></div>` +
    '<div class="lbls">' + BANDS.map((b, i) => `<span class="${i === bi ? 'on' : ''}">${b.label}</span>`).join('') + '</div>';

  /* --- 融资负债 --- */
  document.getElementById('finNote').textContent = '年化 ' + annual.toFixed(1) + '% · ' + days + ' 天已计息';
  const fixedY = (fin.fixed && fin.fixed[y]) || 0;
  document.getElementById('finGrid').innerHTML = [
    { l: '融资负债', v: fmt(debt), n: '本金 ' + fmt(fin.principal || 0) + ' + 应计 ' + fmt(accrued) },
    { l: '每日利息', v: fmt(fin.daily), n: '自 ' + fin.start + ' 起' },
    { l: '本周期累计利息', v: fmt(accrued), n: days + ' 天 · 含当日' },
    { l: y + ' 年利息合计', v: fmt(fixedY + (finByYear[y] || 0)), n: '已发生 ' + fmt(fixedY) + ' + 本周期' }
  ].map(c => `<div class="cell"><div class="l">${c.l}</div><div class="v">${c.v}</div><div class="n">${c.n}</div></div>`).join('');

  /* --- 持仓卡片 --- */
  document.getElementById('positions').innerHTML = rows.map(r => {
    const live = last.premium && last.premium[r.code] != null;
    const prem = live ? last.premium[r.code] : (r.premium_pct || 0);
    const iopv = (last.iopv && last.iopv[r.code] != null) ? last.iopv[r.code] : (r.iopv || 0);
    const premWarn = Math.abs(prem) >= 5;
    return `<div class="card">
    <div class="pname">
      <h3>${r.alias}<span class="code">${r.code.replace(/^s[hz]/, '')} · ${r.shares.toLocaleString('zh-CN')} 份 · 成本 ${r.cost.toFixed(3)}</span></h3>
      <div class="chg" style="color:${up(r.pnlPct)}">${pct(r.pnlPct)}</div>
    </div>
    <div class="grid" style="margin-top:12px">
      <div class="cell"><div class="l">市值 / 仓位</div><div class="v">${fmt(r.mv)}</div><div class="n">${r.weight.toFixed(1)}% · 目标 ${r.target}%</div></div>
      <div class="cell"><div class="l">累计盈亏</div><div class="v" style="color:${up(r.pnl)}">${signed(r.pnl)}</div><div class="n">持仓成本 ${fmt(r.costAmt)}</div></div>
      <div class="cell"><div class="l">成本 → 现价</div><div class="v">${r.cost.toFixed(3)} → ${r.price.toFixed(3)}</div><div class="n">${last.date} 收盘</div></div>
      <div class="cell"><div class="l">场内溢价</div><div class="v ${premWarn ? 'warn' : ''}" style="color:${premWarn ? RED : 'var(--ink)'}">${premWarn ? '⚠️ ' : ''}${pct(prem)}</div><div class="n">IOPV ${iopv.toFixed(4)}${live ? '' : '（手动快照）'}</div></div>
    </div>
  </div>`;
  }).join('');
}

/* --- 载入三份数据后渲染 --- */
(async () => {
  const yr = TODAY.slice(0, 4);
  const [pos, base, gfl] = await Promise.all([
    fetchJSON('data/portfolio/positions.json', 1), fetchJSON('data/costs/baseline.json', 1),
    fetchJSON('data/loan/gf_loan.json', 1)
  ]);
  let day = await fetchJSON('data/daily/' + yr + '.json', 1);
  if (!day) day = await fetchJSON('data/daily/' + (Number(yr) - 1) + '.json', 1);
  if (!pos || !base || !gfl || !day || !day.days || !day.days.length) {
    document.getElementById('sub').textContent = '数据加载失败，请刷新重试';
    document.getElementById('top').innerHTML = '<div class="loading">数据加载失败</div>';
    return;
  }
  day.days.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  render({ pos, day, base, gfl });
})();
</script>
</body>
</html>
