name: daily-update-and-pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # 兜底：云函数 etf-report 直写失败时 dispatch 本工作流补数据

permissions:
  contents: write   # daily_update.py 需要 commit+push
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 追加当日 ETF 盈亏（幂等，节假日自动跳过）
        if: github.event_name != 'push'   # push 只负责部署；盘中推送严禁把实时价当收盘价写入
        run: python3 job/daily_update.py
        env:
          TZ: Asia/Shanghai

  deploy-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [update-data]
    permissions:
      actions: read    # deploy-pages 查询 artifact 元数据必须要有（缺了会报 Found 0 artifacts）
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main   # 取分支最新：update-data 刚 push 的数据提交必须一起部署，否则站点读不到当天数据
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      - uses: actions/deploy-pages@v5

  # 兜底：整条工作流失败时自动重新 dispatch 一次（只重试一次，防止无限循环）。
  # 注意：不要用 rerun-failed-jobs——它会在同一 run 里再传一份同名 artifact，
  # 导致 deploy-pages 报 "Multiple artifacts named github-pages"。
  retry:
    needs: [deploy-pages]
    if: failure() && github.run_attempt < 2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write   # 触发 workflow_dispatch
    steps:
      - name: 重新触发工作流（新 run，避免同名 artifact 冲突）
        run: gh workflow run daily.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
