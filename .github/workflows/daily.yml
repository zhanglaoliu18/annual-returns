name: daily-update-and-pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # 每日数据更新改由页面按钮手动触发（首页「更新今日收益」）

permissions:
  contents: write   # daily_update.py 需要 commit+push
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 追加当日 ETF 盈亏（幂等，节假日自动跳过）
        if: github.event_name != 'push'   # push 只负责部署；盘中推送严禁把实时价当收盘价写入
        run: python3 job/daily_update.py
        env:
          TZ: Asia/Shanghai

  deploy-pages:
    runs-on: ubuntu-latest
    needs: [update-data]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main   # 取分支最新：update-data 刚 push 的数据提交必须一起部署，否则站点读不到当天数据
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      - uses: actions/deploy-pages@v5
