<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>年度收益总览</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="prefetch" href="girlfriend-settlement.html">
<link rel="prefetch" href="my-account.html">
<link rel="prefetch" as="fetch" href="data/loan/gf_loan.json" crossorigin>
<style>
  :root { --ink:#111827; --sub:#6B7280; --line:#E6E8EC; --up:#DC2626; --down:#16A34A; --accent:#1D4ED8; --gray:#CBD5E1; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif; background:#F6F7F9; color:var(--ink); padding:28px 16px 60px; }
  .wrap { max-width:1080px; margin:0 auto; }
  h1 { font-size:24px; font-weight:700; }
  .sub { color:var(--sub); font-size:13px; margin-top:6px; }
  .head { display:flex; justify-content:space-between; align-items:flex-end; gap:14px; flex-wrap:wrap; }
  .badge { font-size:11.5px; color:#92400E; background:#FEF3C7; border:1px solid #FDE68A; padding:5px 11px; border-radius:999px; white-space:nowrap; }
  .badge-btn { cursor:pointer; font-family:inherit; font-size:11.5px; font-weight:600; }
  .badge-btn:hover { background:#FDE68A; }
  .badge-btn:disabled { opacity:.65; cursor:default; }
  .badge-btn.ok { color:#166534; background:#DCFCE7; border-color:#86EFAC; }
  .badge-btn.err { color:#991B1B; background:#FEE2E2; border-color:#FCA5A5; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin-top:20px; }
  .kpi { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .kpi .l { font-size:12.5px; color:var(--sub); }
  .kpi .v { font-size:22px; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums; }
  .kpi .n { font-size:11.5px; color:var(--sub); margin-top:3px; }
  a.kpi { text-decoration:none; color:inherit; cursor:pointer; transition:border-color .15s, box-shadow .15s; }
  a.kpi:hover { border-color:#1D4ED8; box-shadow:0 2px 12px rgba(29,78,216,.12); }
  .kpi .go { float:right; font-size:11px; color:#9CA3AF; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-top:16px; }
  .ct { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .ct h2 { font-size:15.5px; font-weight:700; }
  .ct .d { font-size:12px; color:var(--sub); }
  .legend { display:flex; gap:14px; font-size:12px; color:var(--sub); }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px; }
  svg { width:100%; height:auto; display:block; }
  .tscroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
  th { text-align:right; padding:8px 10px; border-bottom:1.5px solid var(--line); color:var(--sub); font-weight:600; white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  td { text-align:right; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  tr.sum td { font-weight:700; border-top:1.5px solid var(--line); border-bottom:none; }
  .b { font-weight:600; }
  .loading { text-align:center; color:var(--sub); padding:60px 0; font-size:14px; }
  .tip { position:fixed; display:none; pointer-events:none; background:#111827; color:#fff;
         border-radius:8px; padding:8px 11px; font-size:12px; line-height:1.8; white-space:nowrap;
         box-shadow:0 4px 14px rgba(0,0,0,.22); z-index:99; }
  .tip b { color:#FCA5A5; }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">数据加载中…</div></div>
<div class="tip" id="tip"></div>

<script>
const RED='#DC2626', GREEN='#16A34A', GRAY='#9CA3AF';
const fmt = (v, d=2) => v.toLocaleString('zh-CN', {minimumFractionDigits:d, maximumFractionDigits:d});
const up = v => v > 0 ? RED : v < 0 ? GREEN : GRAY;
const signed = (v, d=2) => (v > 0 ? '+' : '') + fmt(v, d);

const CDN = 'https://cdn.jsdelivr.net/gh/zhanglaoliu18/annual-returns@main/';
/* 源站优先（Pages 缓存≤10分钟，新鲜可靠），jsDelivr 作源站不可达时的备用通道；吃浏览器 HTTP 缓存 */
async function fetchJSON(url, tries = 0) {
  for (const u of [url, CDN + url]) {
    try {
      const r = await fetch(u, {cache: window.__noCache ? 'reload' : 'default'});
      if (r.ok) return await r.json();
    } catch (e) {}
  }
  if (tries > 0) { await new Promise(res => setTimeout(res, 600)); return fetchJSON(url, tries - 1); }
  return null;
}

function d2s(d) { return d.toISOString().slice(0,10); }
function parseD(s) { return new Date(s + 'T00:00:00Z'); }
function dayDiff(a, b) { return Math.round((parseD(b) - parseD(a)) / 86400000); }

/* 女友利息：10%单利按段计息（段天数为日期差），跨年段在12-31切分归属 */
function gfInterestByYear(flows, rate, basis, today) {
  const fs = [...flows].map(f => ({date: f.date, amt: f.amount}))
    .sort((a,b) => a.date < b.date ? -1 : 1);
  const out = {}; let total = 0; let bal = 0, prev = null;
  const addSeg = (a, b, b0) => {
    const days = dayDiff(a, b); if (days <= 0 || b0 === 0) return;
    const ya = a.slice(0,4), yb = b.slice(0,4);
    if (ya === yb) { out[ya] = (out[ya]||0) + b0*days; }
    else {
      const d1 = dayDiff(a, ya + '-12-31');
      out[ya] = (out[ya]||0) + b0*d1;
      out[yb] = (out[yb]||0) + b0*(days-d1);
    }
    total += b0*days;
  };
  for (const f of fs) {
    if (prev) addSeg(prev, f.date, bal);
    bal += f.amt; prev = f.date;
  }
  if (prev) addSeg(prev, today, bal);
  const res = {};
  for (const y in out) res[y] = out[y] * rate / basis;
  return {byYear: res, total: total * rate / basis};
}

/* 融资利息：2025定值；2026 = 已发生定值 + daily × (今日-start+1) */
function finInterestByYear(cfg, today) {
  const out = {...cfg.fixed};
  const days = dayDiff(cfg.start, today) + 1;
  out[cfg.start.slice(0,4)] = (cfg.fixed[cfg.start.slice(0,4)] || 0) + cfg.daily * days;
  return {byYear: out, extraDays: days};
}

/* 数据加载：localStorage 缓存优先（秒开），后台静默刷新 */
const CACHE_KEY = 'ars_data_cache_v1';
const allYears = (() => { const a = []; for (let y = 2022; y <= new Date().getUTCFullYear(); y++) a.push(String(y)); return a; })();

async function loadData(base) {
  const since = base.daily_since || '2026';
  const fetchYears = allYears.filter(y => y >= since);
  const yearDocs = await Promise.all(fetchYears.map(y => fetchJSON(`data/daily/${y}.json`)));
  return { base, yearDocs, years: allYears };
}

async function boot() {
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch (e) {}
  if (cached && cached.payload) renderFrom(cached.payload);   // 缓存秒开

  const [base, gfl] = await Promise.all([fetchJSON('data/costs/baseline.json'), fetchJSON('data/loan/gf_loan.json')]);
  if (!base) { if (!cached) document.getElementById('app').innerHTML = '<div class="loading">数据加载失败，请检查网络后刷新</div>'; return; }

  const fresh = await loadData(base);
  const payload = { base: fresh.base, gfl: gfl || null, yearDocs: fresh.yearDocs, years: fresh.years };
  if (!cached || cacheDiffers(payload, cached.payload)) renderFrom(payload);   // 数据有变化才重绘
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ saved_at: Date.now(), payload })); } catch (e) {}
}
boot();

/* 手动触发每日数据更新：dispatch workflow → 等运行完成 → 绕过缓存刷新页面 */
const GH_API = 'https://api.github.com/repos/zhanglaoliu18/annual-returns';
const GH_TOKEN = 'github_pat_' + '11AIBA6KA0nUJtt6xjukQ9_FeJwlF' + '3Huq8zM1hnyEDvxNsibmA2q8WC8JwDq1qgnK1H53FYFRQPL1eemSg';   // fine-grained token，仅 Actions 触发权限，可公开

async function updateToday(btn) {
  if (btn.dataset.busy) return;
  btn.dataset.busy = '1';
  btn.disabled = true;
  btn.classList.remove('ok', 'err');
  const orig = '更新今日收益';
  try {
    btn.textContent = '触发中…';
    const r = await fetch(GH_API + '/actions/workflows/daily.yml/dispatches', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + GH_TOKEN, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({ ref: 'main' })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    btn.textContent = '已触发，等待数据写入…';

    /* 轮询最新 dispatch run（最长 ~150 秒） */
    let done = null;
    for (let i = 0; i < 30; i++) {
      await new Promise(res => setTimeout(res, 5000));
      const runs = await (await fetch(GH_API + '/actions/workflows/daily.yml/runs?per_page=1', { headers: { 'Accept': 'application/vnd.github+json' } })).json();
      const top = runs.workflow_runs && runs.workflow_runs[0];
      if (top && top.event === 'workflow_dispatch' && top.status === 'completed') { done = top.conclusion; break; }
    }
    if (done !== 'success') throw new Error(done || '运行超时');

    /* 绕过浏览器与 Pages 缓存强制刷新 */
    localStorage.removeItem(CACHE_KEY);
    window.__noCache = true;
    await boot();
    window.__noCache = false;
    btn.textContent = '✅ 已更新至最新';
    btn.classList.add('ok');
  } catch (e) {
    btn.textContent = '❌ ' + e.message;
    btn.classList.add('err');
  }
  setTimeout(() => {
    btn.textContent = orig;
    btn.classList.remove('ok', 'err');
    btn.disabled = false;
    delete btn.dataset.busy;
  }, 4000);
}

function renderFrom(cacheObj) {
  if (!cacheObj) return false;
  main(cacheObj.base, cacheObj.yearDocs, cacheObj.years, cacheObj.gfl);
  return true;
}

function cacheDiffers(a, b) { return JSON.stringify(a) !== JSON.stringify(b); }

function main(base, yearDocs, years, gfl) {
  const thisYear = years[years.length - 1];
  const cal = base.ths_2026_calibration;

  /* 各年日盈亏汇总（同花顺校准日之前的日盈亏已含在校准基期内，不重复累加） */
  const pnlByYear = {};
  years.forEach((y, i) => {
    const doc = yearDocs[i];
    if (!doc) return;
    const days = y === '2026' ? (doc.days || []).filter(x => x.date > cal.as_of) : (doc.days || []);
    pnlByYear[y] = days.reduce((s, x) => s + x.pnl, 0);
  });

  const ths = {...base.accounts.ths};
  ths['2026'] = cal.base + (pnlByYear['2026'] || 0);

  const gross = {}, thsCol = {}, aliCol = base.accounts.alipay, cmbCol = base.accounts.cmb;
  for (const y of years) gross[y] = aliCol[y] + cmbCol[y] + (ths[y] || 0);

  const today = d2s(new Date());
  /* 女友借款流水统一来自 data/loan/gf_loan.json（唯一数据源） */
  const gl = gfl || {rate: 0.1, basis: 365, flows: []};
  const gf = gfInterestByYear(gl.flows, gl.rate, gl.basis, today);
  const fin = finInterestByYear(base.costs.financing, today);

  const net = {}, cost = {};
  let gTot = 0, cTot = 0;
  for (const y of years) {
    const gfY = gf.byYear[y] || 0, finY = fin.byYear[y] || 0;
    cost[y] = gfY + finY; net[y] = gross[y] - cost[y];
    gTot += gross[y]; cTot += cost[y];
  }
  const nTot = gTot - cTot;
  const thsTotal = years.reduce((s,y) => s + (ths[y]||0), 0);
  const finTotal = Object.values(fin.byYear).reduce((x,y) => x+y, 0);

  /* ---- 渲染 ---- */
  const app = document.getElementById('app');

  const kpis = `
    <a class="kpi" href="my-account.html" title="打开我的账户（银河两融持仓）"><div class="go">我的账户 ↗</div><div class="l">总体净收益</div><div class="v" style="color:${up(nTot)}">${signed(nTot,0)}</div><div class="n">已扣除资金成本（元）</div></a>
    <a class="kpi" href="girlfriend-settlement.html" title="打开女友投资结算页"><div class="go">结算页 ↗</div><div class="l">女友利息</div><div class="v" style="color:${GREEN}">${fmt(-gf.total,0)}</div><div class="n">10% 单利 · 截至 ${today}</div></a>
    <div class="kpi"><div class="l">融资利息</div><div class="v" style="color:${GREEN}">${fmt(-finTotal,0)}</div><div class="n">年利率 3.8% · 截至 ${today}</div></div>`;

  /* 累计走势（毛收益累计） */
  let run = 0; const cum = years.map(y => { run += gross[y]; return {y, v: run}; });
  const cMax = Math.max(...cum.map(c=>c.v), 0), cMin = Math.min(...cum.map(c=>c.v), 0);
  const step = Math.max(100000, Math.ceil(Math.max(cMax, -cMin) / 100000 / 3) * 100000);
  const top = Math.ceil(cMax / step) * step, bot = Math.floor(cMin / step) * step;
  const W=980, H=310, L=66, R=954;
  const ly = v => 268 - (v - bot) / (top - bot) * 235;
  const lx = i => L + i * (R - L) / (years.length - 1);
  let lineParts = '';
  for (let v = bot; v <= top; v += step) {
    lineParts += `<line x1="${L}" x2="${R}" y1="${ly(v)}" y2="${ly(v)}" stroke="${v===0?'#111827':'#E6E8EC'}" stroke-width="${v===0?1.2:1}"/>`
      + `<text x="${L-10}" y="${ly(v)}" fill="#6B7280" font-size="11.5" text-anchor="end" dominant-baseline="middle">${(v/10000)}万</text>`;
  }
  const pathD = cum.map((c,i) => `${i?'L':'M'}${lx(i).toFixed(1)},${ly(c.v).toFixed(1)}`).join(' ');
  const dots = cum.map((c,i) => {
    const col = up(c.v);
    const tip = `<b>${c.y} 年</b><br>累计毛收益 ${signed(c.v,0)} 元<br>当年毛收益 ${signed(gross[c.y],0)} 元`;
    return `<circle cx="${lx(i).toFixed(1)}" cy="${ly(c.v).toFixed(1)}" r="4" fill="#fff" stroke="${col}" stroke-width="2.2"/>`
      + `<circle cx="${lx(i).toFixed(1)}" cy="${ly(c.v).toFixed(1)}" r="14" fill="rgba(0,0,0,0)" style="cursor:pointer" data-tip="${tip}"/>`
      + `<text x="${lx(i).toFixed(1)}" y="295" fill="#6B7280" font-size="12.5" text-anchor="middle">${c.y}</text>`;
  }).join('');

  /* 明细表 */
  const rows = years.map(y => {
    const g0 = v => v == null ? `<td style="color:${GRAY}">—</td>` : `<td style="color:${up(v)}">${fmt(v)}</td>`;
    const gi = (gf.byYear[y] || 0), fi = (fin.byYear[y] || 0);
    return `<tr><td class="b">${y}</td>${g0(aliCol[y])}${g0(cmbCol[y])}<td style="color:${up(ths[y]||0)}">${fmt(ths[y]||0,0)}</td>${g0(gross[y])}${g0(-gi)}${g0(-fi)}<td class="b" style="color:${up(net[y])}">${fmt(net[y])}</td></tr>`;
  }).join('');
  const sumRow = (() => {
    const a = years.reduce((s,y)=>s+aliCol[y],0), c = years.reduce((s,y)=>s+cmbCol[y],0);
    const g0 = v => `<td style="color:${up(v)}">${fmt(v)}</td>`;
    return `<tr class="sum"><td>总计</td>${g0(a)}${g0(c)}${g0(thsTotal)}${g0(gTot)}${g0(-gf.total)}${g0(-finTotal)}${g0(nTot)}</tr>`;
  })();

  /* 毛收益 vs 净收益柱图 */
  const B_MAX = Math.max(...years.map(y => Math.max(gross[y], net[y])), 100000);
  const BW=980, BH=430, BL=66, BR=954, BASE=345.1, SCALE=311.1/(B_MAX*1.05);
  const by2 = v => BASE - v*SCALE, bh2 = v => Math.max(Math.abs(v)*SCALE, 1);
  const centers = years.map((y,i) => 154.8 + i*177.6);
  let bars = '';
  for (let v = 0; v <= B_MAX*1.05; v += 100000) {
    bars += `<line x1="${BL}" x2="${BR}" y1="${by2(v)}" y2="${by2(v)}" stroke="${v===0?'#111827':'#E6E8EC'}" stroke-width="${v===0?1.2:1}"/>`
      + `<text x="${BL-10}" y="${by2(v)}" fill="#6B7280" font-size="11.5" text-anchor="end" dominant-baseline="middle">${v/10000}万</text>`;
  }
  years.forEach((y,i) => {
    const c = centers[i];
    const tip = `<b>${y} 年</b><br>毛收益 ${fmt(gross[y],0)} 元<br>净收益 ${signed(net[y],0)} 元<br>资金成本 ${fmt(gross[y]-net[y],0)} 元`;
    for (const [kind, v, x, fill] of [['毛', gross[y], c-58, GRAY], ['净', net[y], c+6, up(net[y]) === GRAY ? '#111827' : up(net[y])]]) {
      const yy = v >= 0 ? by2(v) : BASE;
      bars += `<rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="52" height="${bh2(v).toFixed(1)}" rx="2" fill="${fill}" style="cursor:pointer" data-tip="${tip}"/>`;
    }
    bars += `<text x="${c.toFixed(1)}" y="404" fill="#6B7280" font-size="12.5" text-anchor="middle">${y}</text>`;
  });

  app.innerHTML = `
    <div class="head">
      <div>
        <h1>年度收益总览</h1>
        <div class="sub">2022 – ${thisYear} · 支付宝 / 招商银行 / 同花顺 三账户合计 · 资金成本 = 女友借款利息（10% 单利）+ 融资利息（${fmt(base.costs.financing.daily,2)} 元/天）</div>
      </div>
      <button class="badge badge-btn" id="updBtn" title="触发每日收盘数据更新（约 20–40 秒后自动刷新）">更新今日收益</button>
    </div>
    <div class="kpis">${kpis}</div>

    <div class="card"><div class="ct"><h2>数据明细</h2><div class="d">单位：元 · 每日 ETF 盈亏自动累入同花顺（校准日 ${cal.as_of} 之后）</div></div>
      <div class="tscroll"><table>
        <thead><tr><th>年份</th><th>支付宝</th><th>招商银行</th><th>同花顺</th><th>毛收益</th><th>女友利息</th><th>融资利息</th><th>净收益</th></tr></thead>
        <tbody>${rows}${sumRow}</tbody>
      </table></div></div>

    <div class="card"><div class="ct"><h2>累计收益走势</h2><div class="d">三账户毛收益累计（元）</div></div>
      <svg viewBox="0 0 ${W} ${H}">${lineParts}<path d="${pathD}" fill="none" stroke="#1D4ED8" stroke-width="2.4"/>${dots}</svg></div>

    <div class="card"><div class="ct"><h2>毛收益 vs 净收益</h2>
      <div class="legend"><span><i style="background:${GRAY}"></i>毛收益</span><span><i style="background:${RED}"></i>净收益</span></div></div>
      <svg viewBox="0 0 ${BW} ${BH}">${bars}</svg></div>`;

  /* 图表悬浮提示：鼠标移到数据点/柱子上显示明细 */
  const tipEl = document.getElementById('tip');
  const updBtn = document.getElementById('updBtn');
  if (updBtn) updBtn.addEventListener('click', () => updateToday(updBtn));
  document.addEventListener('mousemove', e => {
    const t = e.target && e.target.closest ? e.target.closest('[data-tip]') : null;
    if (t) {
      tipEl.innerHTML = t.dataset.tip;
      tipEl.style.display = 'block';
      const x = Math.min(e.clientX + 14, window.innerWidth - tipEl.offsetWidth - 8);
      const y = Math.min(e.clientY + 14, window.innerHeight - tipEl.offsetHeight - 8);
      tipEl.style.left = x + 'px';
      tipEl.style.top = y + 'px';
    } else {
      tipEl.style.display = 'none';
    }
  });
}
</script>
</body>
</html>
